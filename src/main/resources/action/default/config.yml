# 默认活动配置
# 每个 action/<活动名>/ 都应包含 config.yml、heads.yml、rewards.yml。
# 本文件只放活动玩法规则，不存放运行数据。

activity:
  # 活动显示名，可使用 MiniMessage RGB/Hex。
  display-name: "<#FFD700>默认奖励活动"
  enabled: true

rules:
  # /dz start 切换到该活动时，是否清理当前已生成的奖励点。
  clear-active-on-start: true
  # 每名玩家最大领取次数；0 表示不限制。
  max-claims-per-player: 0
  # 同一玩家两次领取之间的冷却秒数；0 表示不限制。
  claim-cooldown-seconds: 0
  # 是否允许同一玩家重复抽到同一奖励。
  allow-repeat-rewards: true

spawn-region:
  # 本活动专属生成世界和范围；每个活动必须配置。
  # 写法一：MAX_RADIUS
  # - world 指定生成世界名，例如 world、world_nether、resource_world。
  # - center-x / center-z 是中心点。
  # - max-radius 是最大半径。
  # - 实际范围为：
  #   x = center-x - max-radius 到 center-x + max-radius
  #   z = center-z - max-radius 到 center-z + max-radius
  world: "world"
  mode: "MAX_RADIUS"
  center-x: 0
  center-z: 0
  max-radius: 5000

  # 写法二：BOX
  # - 如果把 mode 改成 "BOX"，插件会使用下面的最大/最小边界。
  # - min-x / max-x 是 X 坐标最小值和最大值。
  # - min-z / max-z 是 Z 坐标最小值和最大值。
  # - min-y / max-y 是生成高度最小值和最大值。
  # - 示例：min-x: -3000, max-x: 3000 表示 X 只能在 -3000 到 3000 之间。
  min-x: -3000
  max-x: 3000
  min-z: -3000
  max-z: 3000
  min-y: 80
  max-y: 160
