# DropZone 发奖队列设置
# 玩家领取成功后，奖励会先进入队列，再由服务器慢慢执行命令。

reward-outbox:
  enabled: true

  # 每隔多少秒检查一次有没有待发的奖励。
  poll-interval-seconds: 2

  # 命令执行失败时最多再试几次。
  max-attempts: 5

  # 每次最多处理多少条，避免一口气执行太多命令。
  claim-batch-size: 20

  # 奖励卡在发放中超过这个时间，会重新放回队列。
  processing-timeout-seconds: 60

  # CURRENT_SERVER 只由领取所在服务器发奖；SAME_GROUP 允许同组服务器代发；ANY_SERVER 允许任意服务器代发。
  consume-mode: "CURRENT_SERVER"
