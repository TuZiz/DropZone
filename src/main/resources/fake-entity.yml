# DropZone 假头颅显示配置
# 玩家可见文本请修改 lang/zh_cn.yml。

fake-entity:
  # 当前只保留 ProtocolLib 后端；旧配置 packetevents 会自动回退并提示。
  packet-backend: "protocolib"

  # debug-packets 会输出每次发包细节，只建议临时排查时打开。
  debug-packets: false

  # 打开后能看到假 ArmorStand 本体，方便判断高度和位置；排查完请关闭。
  debug-visible-armorstand: false

  # ProtocolLib 假 ArmorStand 头盔坐标相对奖励点坐标的 Y 偏移。
  # 头颅偏低可调为 -0.65；头颅偏高可调为 -1.05。
  armor-stand-y-offset: -0.85
  armor-stand-small: true
  armor-stand-marker: false

  view-distance: 48.0
  attract-distance: 3.0
  pickup-distance: 0.7
  fly-speed: 0.22
  update-interval-ticks: 2
  bobbing: true
  bobbing-height: 0.25
  rotate: true
  rotation-speed: 6.0
  glow-by-rarity: true
  default-glow: false
