# DropZone 主配置
# 玩家可见文本请修改 lang/zh_cn.yml，不要写在本文件。

settings:
  debug: false
  language: "zh_CN"

storage:
  # LOCAL_JSON 仅适合单服测试；正式服和多服必须使用 MYSQL。
  mode: "LOCAL_JSON"
  # LOCAL_JSON 测试模式使用的本地运行数据目录。
  folder: "data"
  active-activity-file: "activity-state.json"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "dropzone"
    username: "dropzone"
    password: "password"
    params: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
    pool-size: 5
    connection-timeout-ms: 10000
    max-lifetime-ms: 1800000

server:
  # 必须在同一个服务器网络中唯一。
  id: "survival-1"
  # 同一个 group 的服务器共享奖励点，不同 group 互不影响。
  group: "main"

cross-server:
  enabled: false
  # 每隔多少秒从 MySQL 全量同步当前活动和奖励点状态。
  sync-interval-seconds: 3
  # ANY_SERVER 表示任意服务器都可在获得数据库锁后生成。
  spawn-owner-mode: "ANY_SERVER"

action:
  root-folder: "action"
  default-activity: "default"
  config-file: "config.yml"
  heads-file: "heads.yml"
  rewards-file: "rewards.yml"

claim:
  denied-ignore-seconds: 3

location-rules:
  require-air: true
  require-solid-ground: true
  allow-water: false
  allow-lava: false
  avoid-blocks:
    - "BEDROCK"
    - "BARRIER"
  max-location-attempts: 50
  allow-unloaded-chunks: false
  load-chunk-if-needed: false
  max-sync-chunk-loads-per-cycle: 0

reward-selection:
  mode: "RARITY_THEN_REWARD"

reward-command:
  # GLOBAL_SAFE 是默认安全模式；PLAYER_REGION 仅用于明确支持 Folia player region 的命令。
  executor: "GLOBAL_SAFE"

reward-outbox:
  enabled: true
  poll-interval-seconds: 2
  max-attempts: 5
  claim-batch-size: 20
  # PROCESSING 超过该时间会恢复为 PENDING，避免崩服后永久卡住。
  processing-timeout-seconds: 60
  # CURRENT_SERVER 只消费本服任务；SAME_GROUP 消费同组任务；ANY_SERVER 允许任意服务器消费。
  consume-mode: "CURRENT_SERVER"

spawn:
  enabled: true
  # LOCAL_ONLY 为单服生成；DATABASE_LOCK 通过 MySQL 锁避免多服同时生成。
  cross-server-mode: "LOCAL_ONLY"
  interval-seconds: 300
  max-active: 10
  despawn-seconds: 600
  spawn-on-startup: true
  startup-amount: 3
  attempts-per-cycle: 3
  manual:
    mode: "PLAYER_NEAR"
    amount: 1
    max-amount: 20
    near-radius: 3
    respect-region: false

fake-entity:
  packet-backend: "packetevents"
  debug-packets: false
  debug-visible-armorstand: false
  view-distance: 48.0
  attract-distance: 3.0
  pickup-distance: 0.7
  fly-speed: 0.22
  update-interval-ticks: 2
  bobbing: true
  bobbing-height: 0.25
  rotate: true
  rotation-speed: 6.0
  glow-by-rarity: true
  default-glow: false

navigation:
  actionbar:
    enabled: true
    interval-ticks: 20
    max-distance: 0.0

effects:
  idle-particle:
    enabled: true
    name: "END_ROD"
    interval-ticks: 10
    count: 2
    offset-x: 0.18
    offset-y: 0.18
    offset-z: 0.18
    speed: 0.01
  claim:
    sound:
      enabled: true
      name: "ENTITY_PLAYER_LEVELUP"
      volume: 1.0
      pitch: 1.2
    particle:
      enabled: true
      name: "VILLAGER_HAPPY"
      count: 20
      offset-x: 0.4
      offset-y: 0.6
      offset-z: 0.4
      speed: 0.02
    title:
      enabled: true
      fade-in: 10
      stay: 40
      fade-out: 10
    actionbar:
      enabled: true

reload:
  clear-active-entities: true
