# DropZone 主配置
# 玩家可见文本请修改 lang/zh_cn.yml，不要写在本文件。

settings:
  debug: false
  language: "zh_CN"

storage:
  # LOCAL_JSON 仅适合单服测试；正式服和多服必须使用 MYSQL。
  mode: "LOCAL_JSON"
  # LOCAL_JSON 测试模式使用的本地运行数据目录。
  folder: "data"
  active-activity-file: "activity-state.json"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "dropzone"
    username: "dropzone"
    password: "password"
    params: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
    pool-size: 5
    connection-timeout-ms: 10000
    max-lifetime-ms: 1800000

server:
  # 必须在同一个服务器网络中唯一。
  id: "survival-1"
  # 同一个 group 的服务器共享奖励点，不同 group 互不影响。
  group: "main"

cross-server:
  enabled: false
  # 每隔多少秒从 MySQL 全量同步当前活动和奖励点状态。
  sync-interval-seconds: 3
  # ANY_SERVER 表示任意服务器都可在获得数据库锁后生成。
  spawn-owner-mode: "ANY_SERVER"

action:
  root-folder: "action"
  default-activity: "default"
  config-file: "config.yml"
  heads-file: "heads.yml"
  rewards-file: "rewards.yml"

claim:
  denied-ignore-seconds: 3

location-rules:
  require-air: true
  require-solid-ground: true
  allow-water: false
  allow-lava: false
  avoid-blocks:
    - "BEDROCK"
    - "BARRIER"
  max-location-attempts: 50
  allow-unloaded-chunks: false
  load-chunk-if-needed: false
  max-sync-chunk-loads-per-cycle: 0

reward-selection:
  mode: "RARITY_THEN_REWARD"

reward-command:
  # GLOBAL_SAFE 是默认安全模式；PLAYER_REGION 仅用于明确支持 Folia player region 的命令。
  executor: "GLOBAL_SAFE"

spawn:
  enabled: true
  # LOCAL_ONLY 为单服生成；DATABASE_LOCK 通过 MySQL 锁避免多服同时生成。
  cross-server-mode: "LOCAL_ONLY"
  interval-seconds: 300
  max-active: 10
  despawn-seconds: 600
  spawn-on-startup: true
  startup-amount: 3
  attempts-per-cycle: 3
  manual:
    mode: "PLAYER_NEAR"
    amount: 1
    max-amount: 20
    near-radius: 3
    respect-region: false

navigation:
  # 给玩家一点找奖励点的方向提示；想让玩家自己找，就关掉。
  actionbar:
    enabled: true
    # 提示刷新间隔，20 tick 约等于 1 秒。
    interval-ticks: 20
    # 距离太远时不提示；0 表示不限制。
    max-distance: 0.0

effects:
  # 奖励点旁边冒出的提示粒子，方便玩家发现。
  idle-particle:
    enabled: true
    # 粒子名字，填当前服务端版本支持的 Bukkit 粒子名。
    name: "END_ROD"
    # 粒子出现间隔，数值越小越密。
    interval-ticks: 10
    # 每次冒几个粒子。
    count: 2
    # 粒子散开的范围。
    offset-x: 0.18
    offset-y: 0.18
    offset-z: 0.18
    # 粒子速度，一般不用调太大。
    speed: 0.01
  # 玩家拿到奖励时的反馈。
  claim:
    # 领取音效。
    sound:
      enabled: true
      name: "ENTITY_PLAYER_LEVELUP"
      volume: 1.0
      pitch: 1.2
    # 领取粒子。
    particle:
      enabled: true
      name: "VILLAGER_HAPPY"
      count: 20
      offset-x: 0.4
      offset-y: 0.6
      offset-z: 0.4
      speed: 0.02
    # 屏幕中间的领取提示，文字在 lang/zh_cn.yml。
    title:
      enabled: true
      fade-in: 10
      stay: 40
      fade-out: 10
    # 物品栏上方的领取提示，文字在 lang/zh_cn.yml。
    actionbar:
      enabled: true

reload:
  clear-active-entities: true
